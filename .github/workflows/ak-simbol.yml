# Terjemahkan alamat backtrace crash libunity.so (dari logcat emulator) menjadi nama fungsi Unity.
name: AK Simbol Crash
on:
  push:
    branches: ['emu-*']
jobs:
  simbol:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Kosongkan disk runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - name: Terjemahkan alamat crash
        run: |
          ALAMAT="0x4b888c 0x4bb9c8 0x6201b0 0x73281c 0x72cfd0 0x72d640 0x5e051c 0x5e1f58 0x5e1ca0 0x5e1b2c 0x64c418"
          docker run --rm unityci/editor:ubuntu-6000.0.58f2-android-3 bash -c "
            echo '== kandidat simbol'; find /opt/unity -iname 'libunity*.so*' -path '*arm64*' 2>/dev/null | head -20
            S=\$(find /opt/unity -iname 'libunity.sym.so' -path '*il2cpp*' -path '*Release*' -path '*arm64*' 2>/dev/null | head -1)
            [ -z \"\$S\" ] && S=\$(find /opt/unity -iname 'libunity.sym.so' -path '*arm64*' 2>/dev/null | head -1)
            A=\$(find / -name 'llvm-addr2line' -type f 2>/dev/null | head -1)
            echo \"SIM=\$S\"; echo \"A2L=\$A\"
            \$A -C -f -i -e \"\$S\" $ALAMAT
          "
