# Terjemahkan alamat backtrace crash libunity.so (dari logcat emulator) menjadi nama fungsi Unity.
name: AK Simbol Crash
on:
  push:
    branches: ['emu-*']
jobs:
  simbol:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Kosongkan disk runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
      - name: Terjemahkan alamat crash
        run: |
          ALAMAT="0x4b888c 0x4bb9c8 0x6201b0 0x73281c 0x72cfd0 0x72d640 0x5e051c 0x5e1f58 0x5e1ca0 0x5e1b2c 0x64c418"
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu > /dev/null
          C=$(docker create unityci/editor:ubuntu-6000.0.58f2-android-3)
          docker cp "$C:/opt/unity/Editor/Data/PlaybackEngines/AndroidPlayer/Variations/il2cpp/Release/Symbols/arm64-v8a/libunity.sym.so" ./libunity.sym.so
          ls -la libunity.sym.so
          echo "== hasil"; aarch64-linux-gnu-addr2line -C -f -i -e libunity.sym.so $ALAMAT
