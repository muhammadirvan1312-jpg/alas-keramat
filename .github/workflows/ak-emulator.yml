# Uji APK di emulator Android (x86_64 + terjemahan ARM64) untuk merekam logcat crash saat game dibuka.
# Dipicu push ke cabang emu-*. Variabel RUN_ID = run CI yang artefak hasil-<n>-nya berisi APK.
name: AK Emulator
on:
  push:
    branches: ['emu-*']
permissions:
  actions: read
  contents: read
env:
  RUN_ID: "44952249743"
  PAKET: "com.alaskeramat.game"
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [34, 30]
    steps:
      - name: Ambil APK dari run CI
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: hasil-*
          path: apk
      - name: Cari APK
        run: |
          APK=$(find apk -name "*.apk" | head -n1); echo "APK=$APK" >> "$GITHUB_ENV"; ls -la "$APK"
      - name: Aktifkan KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Jalankan game di emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          ram-size: 6144M
          disk-size: 8G
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash Tools/uji_emulator.sh "$APK" "$PAKET" logcat_api${{ matrix.api }}
      - name: Unggah logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-api${{ matrix.api }}
          path: logcat_api*
          if-no-files-found: ignore
