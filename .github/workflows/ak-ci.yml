# AK CI — kompilasi Unity, Builder 1-klik, Self-Test, foto kualitas (bila bisa), APK uji.
# Titik awal: Codex WAJIB menjalankan, membaca hasil, dan memperbaiki file ini di Tahap T0-C (docs/tech/18).
# Secrets wajib: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD.
name: AK CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ak-ci-${{ github.head_ref || github.ref }}
  # Build main tidak dibatalkan (setiap merge harus menghasilkan APK); PR boleh dibatalkan oleh push baru.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  unity:
    name: Unity — bangun, uji, APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Kosongkan disk runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Bersihkan laporan CI lama
        shell: bash
        run: |
          rm -f Logs/ci/ringkasan.md Logs/ci/LAPORAN_CI.md Logs/nusantara_selftest.txt Logs/nusantara_build_report.txt

      - name: Lewati bila proyek Unity belum ada
        id: cekproyek
        shell: bash
        run: |
          if [ -f ProjectSettings/ProjectVersion.txt ]; then echo "ada=1" >> "$GITHUB_OUTPUT"; else echo "ada=0" >> "$GITHUB_OUTPUT"; echo "[AK] ProjectVersion.txt belum ada, job dilewati."; fi

      - name: Python
        if: steps.cekproyek.outputs.ada == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache aset CC0 & mocap
        if: steps.cekproyek.outputs.ada == '1'
        uses: actions/cache@v4
        with:
          path: Assets/ThirdParty
          key: thirdparty-${{ hashFiles('Tools/aset_cc0.lock.json', 'Tools/mocap.lock.json', 'Tools/karakter.lock.json', 'Tools/karakter/**', 'Tools/visual/**') }}

      - name: Unduh aset CC0 & mocap sesuai lock
        if: steps.cekproyek.outputs.ada == '1' && hashFiles('Tools/ambil_aset.py') != ''
        shell: bash
        run: |
          python -m pip install --quiet requests
          python Tools/ambil_aset.py --semua --keluar Assets/ThirdParty

      - name: Panggang visual G3 (MakeHuman CC0 dan LOD pohon)
        if: steps.cekproyek.outputs.ada == '1'
        shell: bash
        run: |
          if ! python Tools/visual/siapkan.py --cek; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y blender > /tmp/ak-blender-install.log
          fi
          python Tools/visual/siapkan.py

      # Cache Library dipulihkan dari run terbaru & DISIMPAN ULANG setiap run (termasuk saat gagal),
      # supaya shader & impor aset tidak dikompilasi ulang dari nol (build APK pertama ±16 menit untuk shader).
      - name: Pulihkan cache Library Unity
        id: cachelib
        if: steps.cekproyek.outputs.ada == '1'
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-

      - name: Unity — Builder + Self-Test + APK
        id: build
        if: steps.cekproyek.outputs.ada == '1'
        continue-on-error: true
        timeout-minutes: 75
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: AlasKeramat.EditorTools.NusantaraCI.BuildAndTest
          allowDirtyBuild: true
          customParameters: -akLaporan Logs/ci

      - name: Ambil alih kepemilikan file dari container Unity
        if: always() && steps.cekproyek.outputs.ada == '1'
        shell: bash
        run: sudo chown -R "$(id -u):$(id -g)" Library Logs build 2>/dev/null || true

      - name: Simpan cache Library Unity (selalu)
        if: always() && steps.cekproyek.outputs.ada == '1'
        uses: actions/cache/save@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-${{ github.run_id }}

      - name: Susun laporan CI (selalu)
        if: always() && steps.cekproyek.outputs.ada == '1'
        shell: bash
        run: |
          # Folder dibuat container Unity (root) -> ambil alih kepemilikan agar bisa ditulis
          sudo chown -R "$(id -u):$(id -g)" Logs build 2>/dev/null || true
          mkdir -p Logs/ci
          LAP=Logs/ci/LAPORAN_CI.md
          {
            echo "# LAPORAN CI"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Hasil langkah Unity: ${{ steps.build.outcome }}"
            echo "- Waktu: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            if [ -f Logs/ci/ringkasan.md ]; then cat Logs/ci/ringkasan.md; else echo "Ringkasan dari NusantaraCI tidak ada (kemungkinan error kompilasi sebelum kode berjalan)."; fi
            echo
            echo "## Baris error yang ditemukan"
            grep -h -E "error CS[0-9]+|Exception|\[AK\]\[GAGAL\]|Scripts have compiler errors" Logs/ci/*.log 2>/dev/null | head -n 80 || true
          } > "$LAP"
          cat "$LAP"

      - name: Simpan laporan ke cabang ci-hasil
        if: always() && steps.cekproyek.outputs.ada == '1'
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" Logs 2>/dev/null || true
          bash Tools/simpan_hasil_ci.sh "${{ github.head_ref || github.ref_name }}" Logs/ci/LAPORAN_CI.md Logs/ci/ringkasan.md Logs/nusantara_selftest.txt Logs/nusantara_build_report.txt

      - name: Unggah artefak (APK, log, foto)
        if: always() && steps.cekproyek.outputs.ada == '1'
        uses: actions/upload-artifact@v4
        with:
          name: hasil-${{ github.run_number }}
          path: |
            build/Android
            Logs/ci
            Logs/foto_kualitas
          if-no-files-found: ignore
          retention-days: 7

      - name: Tandai gagal bila Unity gagal
        if: steps.build.outcome == 'failure'
        run: exit 1

  # Foto kualitas dipisah dari build: render perangkat lunak (llvmpipe) bisa sangat lambat untuk terrain besar.
  # Job ini TIDAK menentukan lulus/gagal CI (continue-on-error) dan dibatasi waktunya.
  foto:
    name: Foto kualitas (tidak memblokir)
    needs: unity
    if: always() && needs.unity.result == 'success' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Kosongkan disk runner
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1

      - name: Pulihkan aset visual G3
        uses: actions/cache/restore@v4
        with:
          path: Assets/ThirdParty
          key: thirdparty-${{ hashFiles('Tools/aset_cc0.lock.json', 'Tools/mocap.lock.json', 'Tools/karakter.lock.json', 'Tools/karakter/**', 'Tools/visual/**') }}

      - name: Pastikan aset foto siap
        shell: bash
        run: |
          python3 Tools/ambil_aset.py --semua --wajib
          if ! python3 Tools/visual/siapkan.py --cek; then
            sudo apt-get update -qq
            sudo apt-get install --no-install-recommends -y blender > /tmp/ak-blender-foto.log
          fi
          python3 Tools/visual/siapkan.py

      - name: Pulihkan cache Library Unity
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-foto-${{ github.run_id }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-

      - name: Unity — Builder + Foto
        id: foto
        continue-on-error: true
        timeout-minutes: 35
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          buildMethod: AlasKeramat.EditorTools.NusantaraCI.FotoSaja
          allowDirtyBuild: true
          customParameters: -akLaporan Logs/ci

      - name: Simpan foto ke cabang ci-hasil
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" Logs 2>/dev/null || true
          ls -la Logs/foto_kualitas 2>/dev/null || echo "Tidak ada foto."
          bash Tools/simpan_hasil_ci.sh "${{ github.head_ref || github.ref_name }}" Logs/foto_kualitas Logs/ci/foto.log

      - name: Unggah foto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foto-${{ github.run_number }}
          path: |
            Logs/foto_kualitas
            Logs/ci/foto.log
          if-no-files-found: ignore
          retention-days: 14

